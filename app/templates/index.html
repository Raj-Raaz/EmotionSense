<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotionSense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="text-center mb-2">EmotionSense</h1>
                    <p class="text-center text-muted mb-4">
                        Emotion Classification using DistilBERT
                    </p>

                    <form method="POST">
                        <label for="text" class="form-label">Enter your text</label>

                        <textarea
                            name="text"
                            id="text"
                            class="form-control mb-3"
                            rows="5"
                            placeholder="Example: I am very happy today..."
                            required
                        >{{ text }}</textarea>

                        <button type="submit" class="btn btn-primary w-100">
                            Predict Emotion
                        </button>
                    </form>

                    {% if emotion %}
                    <div class="alert alert-success mt-4">
                        <h5>Prediction</h5>
                        <p class="mb-1">
                            <strong>Emotion:</strong> {{ emotion }}
                        </p>
                        <p class="mb-0">
                            <strong>Confidence:</strong> {{ "%.2f"|format(confidence * 100) }}%
                        </p>
                    </div>
                    {% endif %}

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
